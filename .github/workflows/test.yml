name: Test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check generated files
        run: npm run vendor:build && npm run sync:site && git diff --exit-code

      - name: Run test suite
        run: npm test

      - name: Build and test standalone offline package
        run: npm run build:offline && npm run test:offline

      - name: Keep the tested offline download for deployment
        uses: actions/upload-artifact@v4
        with:
          name: offline-toolkit
          path: downloads/kreativ-pdf-offline.zip
          retention-days: 7

      - name: Save test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
