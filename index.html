<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreativ Tools | Free Image Resize and Convert Tool</title>
  <meta name="description" content="Resize and convert images directly in your browser. Fast, private, and free image tools from Kreativ Tools." />
  <meta name="keywords" content="image resize, image converter, jpg to png, png to webp, web image tools" />
  <meta name="author" content="Kreativ Tools" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Kreativ Tools | Free Image Resize and Convert Tool" />
  <meta property="og:description" content="Resize and convert images directly in your browser. Fast, private, and free." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kreativtools.com/" />
  <meta property="og:image" content="https://kreativtools.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kreativ Tools | Free Image Resize and Convert Tool" />
  <meta name="twitter:description" content="Resize and convert images directly in your browser. Fast, private, and free." />
  <meta name="twitter:image" content="https://kreativtools.com/og-image.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div class="brand-copy">
        <strong>Kreativ Tools</strong>
        <span>by Olaru AI</span>
      </div>
    </div>

    <nav class="top-nav" aria-label="Primary">
      <a href="#" aria-current="page">Image</a>
      <a href="#">PDF</a>
      <a href="#">Video</a>
      <a href="#">File</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="ghost">All Tools</button>
      <button type="button" class="primary">Start Free</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">Image Suite</p>
      <h1>Resize an Image or Photo</h1>
      <p>Upload once, then resize dimensions or convert format in a few clicks.</p>
    </section>

    <section class="upload-card">
      <input id="imageInput" type="file" accept="image/*" hidden />
      <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Upload image">
        <div class="drop-icon" aria-hidden="true"></div>
        <button id="uploadButton" type="button" class="primary upload-trigger">Upload from Device</button>
        <p>or drag and drop an image here</p>
        <p id="status" class="status">No file selected yet.</p>
      </div>
    </section>

    <section id="workspace" class="workspace is-hidden">
      <div class="controls">
        <div class="tool-switcher" role="tablist" aria-label="Tool type">
          <button id="toolResize" type="button" class="tool-button is-active" aria-pressed="true">Resize</button>
          <button id="toolConvert" type="button" class="tool-button" aria-pressed="false">Convert</button>
        </div>

        <div id="resizeFields" class="input-grid">
          <label>
            Width (px)
            <input id="widthInput" type="number" min="1" placeholder="e.g. 1200" />
          </label>
          <label>
            Height (px)
            <input id="heightInput" type="number" min="1" placeholder="e.g. 800" />
          </label>
        </div>

        <div class="input-grid">
          <label>
            Output format
            <select id="formatInput">
              <option value="image/jpeg">JPG</option>
              <option value="image/png" selected>PNG</option>
              <option value="image/webp">WEBP</option>
            </select>
          </label>

          <label>
            <span class="quality-head">Quality <strong><span id="qualityValue">92</span>%</strong></span>
            <input id="qualityInput" type="range" min="1" max="100" value="92" />
          </label>
        </div>

        <label id="ratioRow" class="checkbox-row">
          <input id="keepRatio" type="checkbox" checked />
          Keep aspect ratio
        </label>

        <button id="applyButton" type="button" class="primary" disabled>Apply Resize</button>
        <button id="downloadButton" type="button" class="primary" disabled>Download Image</button>
      </div>

      <div class="preview-panel">
        <h2>Preview</h2>
        <canvas id="previewCanvas" aria-label="Image preview"></canvas>
        <p id="dimensions" class="dimensions"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
